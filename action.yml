name: Contribution Brickfall
description: >-
  Render a GitHub contribution graph as falling Tetris and LEGO bricks.
  Writes one animated light SVG and one animated dark SVG.
author: KenYanL

branding:
  icon: grid
  color: green

inputs:
  github_user_name:
    description: >-
      GitHub login whose contribution calendar is drawn. 1-39 letters, digits,
      or single hyphens; not empty, and not starting or ending with a hyphen.
    required: true
  svg_light_path:
    description: >-
      Workspace-relative file path for the light-theme SVG. Must end in .svg
      and must not contain '..'.
    required: false
    default: dist/tetris-contrib.svg
  svg_dark_path:
    description: >-
      Workspace-relative file path for the dark-theme SVG. Must end in .svg,
      must not contain '..', and must differ from svg_light_path.
    required: false
    default: dist/tetris-contrib-dark.svg
  token:
    description: >-
      Non-empty token used to read the public contribution calendar. Defaults
      to the calling workflow's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  seed:
    description: >-
      Integer from -2147483648 to 2147483647. The same seed always builds the
      same bricks. Leave empty (or 0) for the stable pack.
    required: false
    default: "0"
  speed:
    description: >-
      Positive animation speed. 1 plays at the normal pace, 2 plays twice as
      fast, and 0.5 plays at half speed. The bricks do not change. An empty
      value is rejected; omit the input to keep the normal pace.
    required: false
    default: "1.0"
  palette:
    description: >-
      Contribution colors for both SVGs. default is the usual green graph.
      halloween uses GitHub's Halloween graph colors. christmas uses Coolors'
      popular Christmas palette. newyear uses Color Hunt's New Year gold palette.
      lunarnewyear uses Color Hunt's Lunar New Year palette
      (https://colorhunt.co/palette/fef3e2fab12ffa812fdd0303).
      auto uses halloween on 31 October (UTC), christmas on 24-26 December (UTC),
      newyear on 1 January (UTC), and lunarnewyear on the Lunar New Year date
      plus the next two UTC days in 2026-2035 (17-19 February 2026,
      6-8 February 2027, 26-28 January 2028, 13-15 February 2029,
      3-5 February 2030, 23-25 January 2031, 11-13 February 2032,
      31 January-2 February 2033, 19-21 February 2034, and 8-10 February 2035).
      A year outside that table stays on default, and 1 January stays newyear.
      Omit the input to keep the usual green graph. An empty value is rejected.
    required: false
    default: "default"

outputs:
  svg_light_path:
    description: Path of the light-theme SVG that was written.
    value: ${{ steps.render.outputs.svg_light_path }}
  svg_dark_path:
    description: Path of the dark-theme SVG that was written.
    value: ${{ steps.render.outputs.svg_dark_path }}

runs:
  using: composite
  steps:
    - name: Render contribution tetris SVGs
      id: render
      shell: bash
      env:
        TETRIS_USER: ${{ inputs.github_user_name }}
        TETRIS_TOKEN: ${{ inputs.token }}
        TETRIS_LIGHT: ${{ inputs.svg_light_path }}
        TETRIS_DARK: ${{ inputs.svg_dark_path }}
        TETRIS_SEED: ${{ inputs.seed }}
        TETRIS_SPEED: ${{ inputs.speed }}
        TETRIS_PALETTE: ${{ inputs.palette }}
        # generate.py keeps SVG paths inside the workspace when this is 1.
        TETRIS_REQUIRE_RELATIVE: "1"
      run: |
        set -euo pipefail
        if ! python3 -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
          echo "contrib-tetris needs Python 3.10 or newer (ubuntu-latest already has it)." >&2
          exit 1
        fi
        token="${TETRIS_TOKEN:-}"
        if [ -z "$token" ]; then
          echo "contrib-tetris: token is empty. Pass a non-empty GitHub token that can read the contribution calendar, or omit token to use the calling workflow's GITHUB_TOKEN." >&2
          exit 1
        fi
        seed="${TETRIS_SEED:-0}"
        if [ -z "$seed" ]; then
          seed=0
        fi
        python3 "${{ github.action_path }}/generate.py" \
          --username "$TETRIS_USER" \
          --token "$token" \
          --light "$TETRIS_LIGHT" \
          --dark "$TETRIS_DARK" \
          --seed "$seed" \
          --speed "${TETRIS_SPEED-1.0}" \
          --palette "${TETRIS_PALETTE-default}"
        {
          echo "svg_light_path<<EOF"
          echo "$TETRIS_LIGHT"
          echo "EOF"
          echo "svg_dark_path<<EOF"
          echo "$TETRIS_DARK"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
