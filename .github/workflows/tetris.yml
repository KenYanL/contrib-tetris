name: Tetris

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test packer
        run: python3 -m unittest test_brickfall.py

  # Publishes the seeded README demo (demo/contributions.json) to the output
  # branch so public preview URLs stay on synthetic data, not a live calendar.
  # Pull requests only run tests.
  demo:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: contrib-tetris-output
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Render seeded demo calendar
        uses: ./
        with:
          github_user_name: demo
          calendar_json: demo/contributions.json
          svg_light_path: dist/tetris-contrib.svg
          svg_dark_path: dist/tetris-contrib-dark.svg

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
